name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Set for every step of every job. 
# They're CI-only throwaway values.
#
# - DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL: lib/env.ts validates
#   all three as soon as it's imported, and fails if any is missing. That
#   happens in `npm run build` (the app's modules are loaded) and in the
#   drizzle-kit steps (drizzle.config.ts imports lib/env). At E2E time, `next start` also uses BETTER_AUTH_SECRET to
#   sign session cookies.
# - TEST_DATABASE_URL: read by e2e/test-env.ts. Playwright's global setup
#   migrates and empties this database (e2e/global-setup.ts), and
#   playwright.config.ts passes it to the app server as its DATABASE_URL,
#   along with BETTER_AUTH_URL set to the test server's address. So during
#   E2E the app talks to this database. The value matches test-env.ts's local
#   default; it's set here so CI doesn't depend on that default.
env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dyad_test
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dyad_test
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
  BETTER_AUTH_URL: http://localhost:3001

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # lets gitleaks comment on the offending line
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks needs the history to diff the PR's or push's commit range
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint and format
        run: npx biome ci
      - name: Typecheck
        run: npm run typecheck
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Unit tests
        run: npm run test:coverage
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      - name: Migrations are consistent
        run: npm run db:check
      - name: Migrations are up to date with the schema
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema changed without a migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain drizzle
            exit 1
          fi

  e2e:
    name: Build and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # A fresh Postgres container for this job only, thrown away afterwards
      postgres:
        image: postgres:18-alpine
        # Read by the official image on its first start (empty data folder):
        # it creates the POSTGRES_USER superuser with POSTGRES_PASSWORD, and an
        # empty POSTGRES_DB database.
        # - User and password must match the URLs in `env:` above: they're the
        #   only login the container has.
        # - The database name should match too, but nothing breaks if it
        #   doesn't: e2e/global-setup.ts creates the URL's database if it's
        #   missing (as it does locally). It must end in "_test", or the
        #   global setup refuses to reset it.
        # Tables come later, from the migrations in e2e/global-setup.ts.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dyad_test
        # Steps run on the runner itself, not in a container, so expose the
        # port there.
        ports:
          - 5432:5432
        # GitHub waits until this check passes before running any step,
        # so the database is accepting connections when E2E starts
        options: >-
          --health-cmd "pg_isready -U postgres -d dyad_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
