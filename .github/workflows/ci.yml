name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI-only values; the database is the throwaway service container below.
# Playwright's global setup migrates and resets it (see e2e/global-setup.ts).
# Only needs to pass lib/env.ts validation for build/drizzle steps
env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dyad_test
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dyad_test
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
  BETTER_AUTH_URL: http://localhost:3001

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint and format
        run: npx biome ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Migrations are consistent
        run: npm run db:check
      - name: Migrations are up to date with the schema
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema changed without a migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain drizzle
            exit 1
          fi

  e2e:
    name: Build and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dyad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dyad_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
