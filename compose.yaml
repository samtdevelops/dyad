name: dyad

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dyad
      POSTGRES_PASSWORD: dyad
      POSTGRES_DB: dyad_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dyad -d dyad_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
